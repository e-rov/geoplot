<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>E.ROV GeoPlot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: field-tool shell — sidebar of modules on wide screens, bottom bar on phones; work area = form panel + live plot. */
:root {
  --bg: #e9ede8; --surface: #f9faf7; --sunk: #dfe5df; --ink: #1b2320; --muted: #5a6762; --line: #c5cfc8;
  --accent: #cf4a10; --accent-ink: #ffffff; --accent-soft: #f6dccd;
  --survey: #0b6e4f; --good: #2b7a3a; --warn: #a86a00; --bad: #c0282d;
  --plot-bg: #f4f6f1; --grid: #dde3dc;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #19201d; --sunk: #0d1110; --ink: #e4ebe7; --muted: #94a49d; --line: #2d3833;
  --accent: #ff7b3a; --accent-ink: #1a0d05; --accent-soft: #3a2316;
  --survey: #4cc38a; --good: #5cc46e; --warn: #e6a93a; --bad: #ff6b6b;
  --plot-bg: #0f1412; --grid: #1f2824; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201d; --sunk: #0d1110; --ink: #e4ebe7; --muted: #94a49d; --line: #2d3833;
  --accent: #ff7b3a; --accent-ink: #1a0d05; --accent-soft: #3a2316;
  --survey: #4cc38a; --good: #5cc46e; --warn: #e6a93a; --bad: #ff6b6b;
  --plot-bg: #0f1412; --grid: #1f2824; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .mark { width: 22px; height: 22px; }
.brand small { font-family: var(--f-body); font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.proj { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.proj-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-state.dirty { color: var(--warn); }

nav.side { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 8px 24px; }
.navgroup { margin-bottom: 14px; }
.navgroup h4 { margin: 0 8px 4px; font: 600 11px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.navbtn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 6px; cursor: pointer; text-align: left; color: var(--ink); }
.navbtn svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.navbtn:hover { background: var(--sunk); }
.navbtn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { overflow-y: auto; padding: 16px; padding-block: 16px 32px; min-width: 0; }
.bottombar { display: none; }

/* views */
.vh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
.vh h1 { font: 700 28px/1.05 var(--f-display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.vh p { margin: 0; color: var(--muted); max-width: 68ch; }
.work { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
.work.wide-left { grid-template-columns: minmax(320px, 520px) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.panel h2 { font: 600 18px/1.2 var(--f-display); letter-spacing: .02em; margin: 0 0 10px; text-transform: uppercase; }
.panel h3 { font-size: 13px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.sticky-plot { position: sticky; top: 0; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.row > * { min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.row > label.f { flex: 1 1 120px; }
label.f > span { font-weight: 500; }
input[type=text], input[type=number], input:not([type]), select, textarea {
  width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 0; }
textarea { font-family: var(--f-mono); font-size: 13px; resize: vertical; }
input.num, td input { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
input.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--bg)); }
.hint { font-size: 12px; color: var(--muted); }
.hint.bad { color: var(--bad); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
a.btn { text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 13px; }
.chip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); font-weight: 600; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border: 1px solid currentColor; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.muted { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 14px; }
.stat .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 500 18px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--muted); }

.tblwrap { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.n, table.t th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
table.lines td { padding: 3px 4px; }
table.lines td input { padding: 5px 6px; }
table.lines td.idx { color: var(--muted); font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }

/* plot */
.plot { position: relative; background: var(--plot-bg); border: 1px solid var(--line); border-radius: var(--r); height: min(72vh, 640px); overflow: hidden; touch-action: none; user-select: none; }
.plot svg.draw { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.plot .tools { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
.plot .tools .btn { width: 34px; height: 34px; padding: 0; background: var(--surface); }
.plot .legend { position: absolute; left: 8px; bottom: 8px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; z-index: 2; }
.plot .coord { position: absolute; right: 8px; bottom: 8px; font: 12px var(--f-mono); color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 2px 6px; border-radius: 4px; z-index: 2; }
.plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapnote { position: absolute; left: 8px; right: 52px; top: 8px; z-index: 3; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 6px; padding: 8px 10px; font-size: 13px; }

.callout { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--surface); border-radius: 6px; padding: 10px 12px; }
.callout.warn { border-left-color: var(--warn); }
.callout.info { border-left-color: var(--survey); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty h3 { color: var(--ink); font: 600 20px var(--f-display); margin: 0 0 6px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--accent); }
.tile svg { width: 24px; height: 24px; stroke: var(--accent); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tile b { font: 600 18px/1.1 var(--f-display); letter-spacing: .02em; }
.tile span { font-size: 12px; color: var(--muted); }

pre.td { white-space: pre-wrap; font-family: var(--f-body); font-size: 14px; line-height: 1.6; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin: 0; max-width: 72ch; }
.sheetwrap { background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; overflow: auto; }
.sheetwrap svg { display: block; margin: 0 auto; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.18); width: 100%; max-width: 760px; height: auto; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 100; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.modal-bg { position: fixed; inset: 0; background: rgba(10,14,12,.5); z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 10px; padding: 18px; width: min(460px, 100%); max-height: 85vh; overflow: auto; border: 1px solid var(--line); }
.modal h2 { font: 600 22px var(--f-display); margin: 0 0 8px; }
.sheet-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sheet-menu .navbtn { flex-direction: column; gap: 4px; font-size: 12px; text-align: center; padding: 10px 4px; border: 1px solid var(--line); }

details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.kbd { font-family: var(--f-mono); font-size: 12px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.sep { height: 1px; background: var(--line); margin: 12px 0; }

@media (max-width: 1000px) {
  .work, .work.wide-left { grid-template-columns: minmax(0, 1fr); }
  .work > .plotcol { order: -1; }
  .plot { height: 46vh; min-height: 280px; }
  .sticky-plot { position: static; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  nav.side { display: none; }
  .top { padding: 8px 12px; }
  .brand small { display: none; }
  main { padding: 12px 16px; padding-block: 12px 24px; }
  .bottombar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bottombar .navbtn { flex-direction: column; gap: 2px; font-size: 11px; padding: 8px 2px; border-radius: 0; text-align: center; }
  .bottombar .navbtn[aria-current="page"] { background: none; }
  .vh h1 { font-size: 24px; }
  .grid3 { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .tile, .navbtn { transition: background .12s, border-color .12s; } }
@media print {
  nav.side, .bottombar, .top, .noprint, .plot .tools { display: none !important; }
  .app { display: block; } main { overflow: visible; }
  .panel { border: 0; padding: 0; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L21 20 H3 Z" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="12" cy="14" r="2.2" fill="var(--accent)"/></svg>
      GeoPlot <small>E.ROV Surveying</small>
    </div>
    <div class="proj">
      <span class="proj-name" id="projName">Loading…</span>
      <span class="save-state" id="saveState"></span>
      <button class="btn sm" id="saveBtn" data-action="save-project">Save</button>
    </div>
  </header>
  <nav class="side" id="sideNav" aria-label="Modules"></nav>
  <main id="view" tabindex="-1">
    <div class="empty"><h3>Starting GeoPlot</h3><p>Loading the survey tools…</p></div>
  </main>
  <nav class="bottombar" id="bottomNav" aria-label="Main"></nav>
</div>
<div id="toastHost"></div>
<div id="modalHost"></div>

<script>
/* Start-up guard: load fonts without blocking, and explain instead of spinning forever. Plain ES5 on purpose. */
(function () {
  try {
    var l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap';
    document.head.appendChild(l);
  } catch (e) {}
  var TIP = 'If you are using Opera: turn off Data savings (Opera menu > Settings > Data savings) and the ad blocker for claude.ai, then reload. Opera Mini cannot run this app. Chrome works best.';
  function show(title, msg) {
    if (window.__geoplotBooted) return;
    var v = document.getElementById('view'); if (!v) return;
    v.innerHTML = '';
    var d = document.createElement('div'); d.className = 'empty';
    var h = document.createElement('h3'); h.textContent = title;
    var p = document.createElement('p'); p.textContent = msg;
    var t = document.createElement('p'); t.textContent = TIP;
    var b = document.createElement('button'); b.className = 'btn'; b.textContent = 'Reload'; b.onclick = function () { location.reload(); };
    d.appendChild(h); d.appendChild(p); d.appendChild(t); d.appendChild(b); v.appendChild(d);
  }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t.tagName && t.tagName !== 'SCRIPT') return; // a font or image failing is harmless
    show('GeoPlot could not start', 'Error: ' + ((e && e.message) || 'a script failed to load') + '.');
  }, true);
  setTimeout(function () { show('GeoPlot is taking too long to start', 'The page loaded but the survey tools did not start within 12 seconds.'); }, 12000);
})();
</script>
<script>
/* E.ROV GeoPlot — survey math core.
 * Pure functions, no DOM. Works in the browser (window.Geo) and in Node (module.exports).
 * Conventions: azimuths are degrees clockwise from grid NORTH (0..360).
 * Points are {N, E} in metres (grid). Geographic is {lat, lon} in decimal degrees.
 */
(function (root) {
  'use strict';
  const G = {};
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  G.D2R = D2R; G.R2D = R2D;

  /* ---------- angles & bearings ---------- */
  const norm360 = a => ((a % 360) + 360) % 360;
  G.norm360 = norm360;

  // decimal degrees -> {d,m,s} with rounding of seconds to `sp` places
  G.toDMS = function (x, sp = 0) {
    const sign = x < 0 ? -1 : 1; x = Math.abs(x);
    let d = Math.floor(x), m = Math.floor((x - d) * 60);
    let s = +(((x - d) * 60 - m) * 60).toFixed(sp);
    if (s >= 60) { s = 0; m += 1; }
    if (m >= 60) { m = 0; d += 1; }
    return { sign, d, m, s };
  };
  const pad = (n, w) => String(n).padStart(w, '0');
  G.fmtDMS = function (x, sp = 0) {
    const r = G.toDMS(x, sp);
    const s = sp ? r.s.toFixed(sp).padStart(3 + sp, '0') : pad(r.s, 2);
    return (r.sign < 0 ? '-' : '') + r.d + '°' + pad(r.m, 2) + "'" + s + '"';
  };

  // Azimuth (from north) -> quadrant bearing parts
  G.azToQuad = function (az) {
    az = norm360(az);
    let ns, ew, ang;
    if (az <= 90) { ns = 'N'; ew = 'E'; ang = az; }
    else if (az <= 180) { ns = 'S'; ew = 'E'; ang = 180 - az; }
    else if (az <= 270) { ns = 'S'; ew = 'W'; ang = az - 180; }
    else { ns = 'N'; ew = 'W'; ang = 360 - az; }
    return { ns, ew, ang };
  };

  /* Format a bearing.
   * style: 'dms' -> N 45°30'15" E ; 'lmb' -> N. 45 deg. 30' E. ; 'plain' -> N 45 30 15 E
   * minutesOnly: round to whole minutes (typical of LMB technical descriptions)
   */
  G.fmtBearing = function (az, style = 'dms', minutesOnly = false) {
    const q = G.azToQuad(az);
    let { d, m, s } = G.toDMS(q.ang, 0);
    if (minutesOnly) {
      const tot = Math.round(q.ang * 60); d = Math.floor(tot / 60); m = tot % 60; s = 0;
    }
    if (d === 0 && m === 0 && s === 0) return 'Due ' + (q.ns === 'N' ? 'North' : 'South');
    if (d === 90 && m === 0 && s === 0) return 'Due ' + (q.ew === 'E' ? 'East' : 'West');
    if (style === 'lmb') {
      return q.ns + '. ' + d + ' deg. ' + pad(m, 2) + "'" + (s ? ' ' + pad(s, 2) + '"' : '') + ' ' + q.ew + '.';
    }
    if (style === 'plain') return q.ns + ' ' + d + ' ' + pad(m, 2) + (minutesOnly ? '' : ' ' + pad(s, 2)) + ' ' + q.ew;
    return q.ns + ' ' + d + '°' + pad(m, 2) + "'" + (minutesOnly ? '' : pad(s, 2) + '"') + ' ' + q.ew;
  };

  const BEARING_RE = /\b([NS])\s*\.?\s*((?:\d+(?:\.\d+)?)(?:\s*(?:°|º|˚|deg(?:rees?|s)?\.?|d\b|'|′|’|min(?:utes?|s)?\.?|"|″|”|''|sec(?:onds?|s)?\.?|-|:|\s)\s*(?:\d+(?:\.\d+)?)?){0,5})\s*(?:'|′|’|"|″|”|''|sec(?:onds?|s)?\.?|min(?:utes?|s)?\.?)?\s*\.?\s*([EW])\b\.?/gi;
  const DUE_RE = /\bdue\s+(north|south|east|west)\b/gi;

  function bearingFromParts(ns, nums, ew) {
    const [d = 0, m = 0, s = 0] = nums.map(Number);
    if (m >= 60 || s >= 60 || d > 90) return null;
    const ang = d + m / 60 + s / 3600;
    ns = ns.toUpperCase(); ew = ew.toUpperCase();
    if (ns === 'N' && ew === 'E') return ang;
    if (ns === 'S' && ew === 'E') return 180 - ang;
    if (ns === 'S' && ew === 'W') return 180 + ang;
    return norm360(360 - ang);
  }

  /* Parse a single bearing / azimuth string -> azimuth from north, or null.
   * Accepts: "N 45 30 15 E", "N45-30E", "N 45°30'15\" E", "N. 45 deg. 30' E.", "Due North",
   * "AZ 123.5" / "az 123 30 00" (azimuth from north), and "AZS 303.5" (azimuth from SOUTH, old PH practice). */
  G.parseBearing = function (str) {
    if (str == null) return null;
    str = String(str).trim();
    if (!str) return null;
    const due = /^due\s+(north|south|east|west)$/i.exec(str);
    if (due) return { north: 0, east: 90, south: 180, west: 270 }[due[1].toLowerCase()];
    const az = /^az(s)?\s*[:=]?\s*(\d+(?:\.\d+)?)(?:[\s°d-]+(\d+(?:\.\d+)?))?(?:[\s'm-]+(\d+(?:\.\d+)?))?/i.exec(str);
    if (az) {
      let v = +az[2] + (+az[3] || 0) / 60 + (+az[4] || 0) / 3600;
      if (az[1]) v += 180; // from-south azimuth
      return norm360(v);
    }
    BEARING_RE.lastIndex = 0;
    const m = BEARING_RE.exec(str);
    if (!m) return null;
    const nums = (m[2].match(/\d+(?:\.\d+)?/g) || []).slice(0, 3);
    if (!nums.length) return null;
    return bearingFromParts(m[1], nums, m[3]);
  };

  G.parseDistance = function (str) {
    if (str == null) return null;
    const m = /(\d[\d,]*(?:\.\d+)?)/.exec(String(str));
    if (!m) return null;
    const v = parseFloat(m[1].replace(/,/g, ''));
    return isFinite(v) ? v : null;
  };

  /* ---------- traverse ---------- */
  G.step = (p, az, d) => ({ N: p.N + d * Math.cos(az * D2R), E: p.E + d * Math.sin(az * D2R) });
  G.inverse = (a, b) => {
    const dN = b.N - a.N, dE = b.E - a.E;
    return { az: norm360(Math.atan2(dE, dN) * R2D), d: Math.hypot(dN, dE), dN, dE };
  };

  // Signed area (positive = counter-clockwise in E,N plane)
  G.signedArea = function (pts) {
    let s = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      s += a.E * b.N - b.E * a.N;
    }
    return s / 2;
  };
  G.area = pts => Math.abs(G.signedArea(pts));
  G.perimeter = pts => pts.reduce((s, p, i) => s + G.inverse(p, pts[(i + 1) % pts.length]).d, 0);
  G.centroid = function (pts) {
    const A = G.signedArea(pts);
    if (Math.abs(A) < 1e-9) {
      const n = pts.length || 1;
      return { N: pts.reduce((s, p) => s + p.N, 0) / n, E: pts.reduce((s, p) => s + p.E, 0) / n };
    }
    let cx = 0, cy = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], f = a.E * b.N - b.E * a.N;
      cx += (a.E + b.E) * f; cy += (a.N + b.N) * f;
    }
    return { E: cx / (6 * A), N: cy / (6 * A) };
  };

  /* Closure of a closed traverse given as [{az,d}] */
  G.closure = function (lines) {
    let lat = 0, dep = 0, per = 0;
    const rows = lines.map(l => {
      const la = l.d * Math.cos(l.az * D2R), de = l.d * Math.sin(l.az * D2R);
      lat += la; dep += de; per += l.d;
      return { az: l.az, d: l.d, lat: la, dep: de };
    });
    const mis = Math.hypot(lat, dep);
    return {
      rows, sumLat: lat, sumDep: dep, perimeter: per, misclosure: mis,
      misAz: mis > 0 ? norm360(Math.atan2(-dep, -lat) * R2D) : 0,
      precision: mis > 1e-9 ? per / mis : Infinity
    };
  };

  /* Adjust a closed traverse. method: 'compass' (Bowditch) or 'transit'.
   * Returns adjusted [{az,d,lat,dep,cLat,cDep}] */
  G.adjust = function (lines, method = 'compass') {
    const c = G.closure(lines);
    const sAbsLat = c.rows.reduce((s, r) => s + Math.abs(r.lat), 0) || 1;
    const sAbsDep = c.rows.reduce((s, r) => s + Math.abs(r.dep), 0) || 1;
    return c.rows.map(r => {
      let cLat, cDep;
      if (method === 'transit') {
        cLat = -c.sumLat * Math.abs(r.lat) / sAbsLat;
        cDep = -c.sumDep * Math.abs(r.dep) / sAbsDep;
      } else {
        cLat = -c.sumLat * r.d / c.perimeter;
        cDep = -c.sumDep * r.d / c.perimeter;
      }
      const lat = r.lat + cLat, dep = r.dep + cDep;
      return { az: norm360(Math.atan2(dep, lat) * R2D), d: Math.hypot(lat, dep), lat, dep, cLat, cDep };
    });
  };

  /* Rotate (degrees, clockwise positive like a bearing change) about pivot, then translate */
  G.transformPts = function (pts, pivot, rotDeg, dN = 0, dE = 0) {
    const t = rotDeg * D2R, c = Math.cos(t), s = Math.sin(t);
    return pts.map(p => {
      const y = p.N - pivot.N, x = p.E - pivot.E;
      // clockwise rotation in (E,N): E' = x cos + y sin ; N' = -x sin + y cos
      return { ...p, E: pivot.E + x * c + y * s + dE, N: pivot.N - x * s + y * c + dN };
    });
  };

  /* Compute a lot from its technical description.
   * lot = { tie:{N,E}, tieLine:{b,d}, lines:[{b,d}], adjust:'none'|'compass'|'transit',
   *         xf:{rot,dN,dE} , corners:[{N,E}] (when mode==='coords') , mode:'td'|'coords' }
   */
  G.computeLot = function (lot) {
    const out = { ok: false, errors: [] };
    const tie = { N: +lot.tie?.N || 0, E: +lot.tie?.E || 0 };
    out.tie = tie;
    let corners = [];
    if (lot.mode === 'coords') {
      corners = (lot.corners || []).map(p => ({ N: +p.N, E: +p.E })).filter(p => isFinite(p.N) && isFinite(p.E));
      if (corners.length < 3) { out.errors.push('Enter at least 3 corners.'); }
      out.closure = { sumLat: 0, sumDep: 0, misclosure: 0, precision: Infinity, perimeter: G.perimeter(corners) };
      out.lines = corners.map((p, i) => G.inverse(p, corners[(i + 1) % corners.length]));
      out.raw = corners;
    } else {
      const parsed = (lot.lines || []).map((l, i) => {
        const az = G.parseBearing(l.b), d = G.parseDistance(l.d);
        if (az == null) out.errors.push('Line ' + (i + 1) + ': bearing not understood ("' + (l.b || '') + '").');
        if (d == null || d <= 0) out.errors.push('Line ' + (i + 1) + ': distance missing.');
        return { az, d };
      }).filter(l => l.az != null && l.d > 0);
      if (parsed.length < 3) out.errors.push('A lot needs at least 3 lines.');
      let start = tie;
      let tieLine = null;
      if (lot.tieLine && (lot.tieLine.b || lot.tieLine.d)) {
        const az = G.parseBearing(lot.tieLine.b), d = G.parseDistance(lot.tieLine.d);
        if (az == null || d == null) out.errors.push('Tie line: bearing or distance not understood.');
        else { tieLine = { az, d }; start = G.step(tie, az, d); }
      }
      out.tieLine = tieLine;
      out.closure = G.closure(parsed);
      let use = parsed;
      if (lot.adjust && lot.adjust !== 'none' && parsed.length >= 3) use = G.adjust(parsed, lot.adjust);
      out.lines = use;
      const raw = [start];
      for (let i = 0; i < parsed.length - 1; i++) raw.push(G.step(raw[i], parsed[i].az, parsed[i].d));
      out.unadjusted = raw;
      corners = [start];
      for (let i = 0; i < use.length - 1; i++) corners.push(G.step(corners[i], use[i].az, use[i].d));
      out.raw = corners;
    }
    // transformation (rotate / move)
    const xf = lot.xf || {};
    if ((+xf.rot || +xf.dN || +xf.dE) && corners.length) {
      const pivot = xf.pivot === 'c1' ? corners[0] : xf.pivot === 'tie' ? tie : G.centroid(corners);
      corners = G.transformPts(corners, pivot, +xf.rot || 0, +xf.dN || 0, +xf.dE || 0);
      out.transformed = true;
    }
    out.corners = corners;
    if (corners.length >= 3) {
      out.area = G.area(corners);
      out.perimeter = G.perimeter(corners);
      out.centroid = G.centroid(corners);
      out.finalLines = corners.map((p, i) => G.inverse(p, corners[(i + 1) % corners.length]));
      out.finalTie = G.inverse(tie, corners[0]);
      out.ok = out.errors.length === 0;
    }
    return out;
  };

  /* Bake the computed (adjusted / transformed) corners back into bearings & distances */
  G.lotFromCorners = function (tie, corners, opts = {}) {
    const dp = opts.dp ?? 2;
    const ti = G.inverse(tie, corners[0]);
    const lines = corners.map((p, i) => {
      const v = G.inverse(p, corners[(i + 1) % corners.length]);
      return { b: G.fmtBearing(v.az, 'plain', !!opts.minutesOnly), d: v.d.toFixed(dp) };
    });
    return { tieLine: { b: G.fmtBearing(ti.az, 'plain', !!opts.minutesOnly), d: ti.d.toFixed(dp) }, lines };
  };

  /* ---------- number words (for TD areas) ---------- */
  const ONES = ['ZERO', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE', 'TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];
  const TENS = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];
  function words999(n) {
    let s = [];
    if (n >= 100) { s.push(ONES[Math.floor(n / 100)] + ' HUNDRED'); n %= 100; }
    if (n >= 20) { s.push(TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '')); }
    else if (n > 0) s.push(ONES[n]);
    return s.join(' ');
  }
  G.numberWords = function (n) {
    n = Math.round(n);
    if (n === 0) return 'ZERO';
    const scales = ['', ' THOUSAND', ' MILLION', ' BILLION'];
    const parts = [];
    let i = 0;
    while (n > 0 && i < scales.length) {
      const c = n % 1000;
      if (c) parts.unshift(words999(c) + scales[i]);
      n = Math.floor(n / 1000); i++;
    }
    return parts.join(' ');
  };

  /* LMB-style narrative technical description */
  G.narrativeTD = function (lot, comp, opts = {}) {
    const mo = opts.minutesOnly !== false;
    const fmt = az => G.fmtBearing(az, 'lmb', mo);
    const dist = d => d.toFixed(2) + ' m.';
    const L = comp.finalLines, n = comp.corners.length;
    const tieName = (lot.tie && lot.tie.name) || 'the tie point';
    let s = (opts.lotTitle ? opts.lotTitle + '\n\n' : '') +
      'Beginning at a point marked "1" on plan, being ' + fmt(comp.finalTie.az) + ', ' + dist(comp.finalTie.d) + ' from ' + tieName + ';\n';
    for (let i = 0; i < n; i++) {
      const to = i === n - 1 ? 'the point of beginning' : 'point ' + (i + 2);
      s += 'thence ' + fmt(L[i].az) + ', ' + dist(L[i].d) + ' to ' + to + (i === n - 1 ? ';' : ';') + '\n';
    }
    const a = Math.round(comp.area);
    s += 'containing an area of ' + G.numberWords(a) + ' (' + a.toLocaleString('en-US') + ') SQUARE METERS, more or less.';
    if (opts.bounds) s += '\n' + opts.bounds;
    return s;
  };

  /* ---------- text parser for technical descriptions ---------- */
  /* Returns { tieName, tieLine:{b,d}|null, lines:[{b,d}], corners:[{name,N,E}], kind } */
  G.parseTDText = function (text, opts = {}) {
    text = String(text || '').replace(/\r/g, '');
    const t = text.replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"').replace(/ /g, ' ');
    const found = [];
    BEARING_RE.lastIndex = 0;
    let m;
    while ((m = BEARING_RE.exec(t))) {
      const nums = (m[2].match(/\d+(?:\.\d+)?/g) || []).slice(0, 3);
      if (!nums.length) continue;
      const az = bearingFromParts(m[1], nums, m[3]);
      if (az == null) continue;
      found.push({ idx: m.index, end: BEARING_RE.lastIndex, az });
    }
    DUE_RE.lastIndex = 0;
    while ((m = DUE_RE.exec(t))) {
      found.push({ idx: m.index, end: DUE_RE.lastIndex, az: { north: 0, east: 90, south: 180, west: 270 }[m[1].toLowerCase()] });
    }
    found.sort((a, b) => a.idx - b.idx);
    const pairs = [];
    for (const f of found) {
      const rest = t.slice(f.end, f.end + 40);
      const dm = /^[\s.,;:\-=_~'"*]*(?:distance\s*(?:of)?\s*)?(\d[\d,]*(?:\.\d+)?)\s*(m\b|m\.|meters?|mts?\.?|metres?)?/i.exec(rest);
      if (!dm) continue;
      const d = parseFloat(dm[1].replace(/,/g, ''));
      if (!(d > 0)) continue;
      const ls = t.lastIndexOf('\n', f.idx) + 1;
      const lm = /(\d{1,3})\s*[-–—=.:]+\s*(\d{1,3})\D{0,6}$/.exec(t.slice(ls, f.idx));
      pairs.push({ az: f.az, d, idx: f.idx, label: lm ? +lm[1] + '-' + +lm[2] : '', after: t.slice(f.end + dm[0].length, f.end + dm[0].length + 120) });
    }
    const res = { tieName: '', tieLine: null, lines: [], corners: [], kind: 'none', name: '' };
    const ln = /\bLOT\s+(?:NO\.?\s*)?(\d[\w]*(?:\s*[-–—]+\s*[\w]+)*)/i.exec(t);
    if (ln) res.name = 'Lot ' + ln[1].replace(/\s*[-–—]+\s*/g, '-');
    if (pairs.length) {
      res.kind = 'bearings';
      let tieIdx = -1;
      // Tabulated LMB forms put the tie line in its own box AFTER the lot lines:
      // "Tie lines from BLLM#1, CAD-459-D, Indang Cadastre, to Corner Marked "1": ... N 45 05 W 3333.42"
      const th = /tie\s*lines?\s*(?:from|fr\.?)\s+([\s\S]{3,140}?)[\s,]*to\s+corner/i.exec(t) || /tie\s*lines?\s*(?:from|fr\.?)\s+([^:\n]{3,80})/i.exec(t);
      if (th) {
        const k = pairs.findIndex(p => p.idx > th.index);
        if (k >= 0) { tieIdx = k; res.tieName = th[1].replace(/\s+/g, ' ').replace(/[\s,;:]+$/, '').trim(); }
      }
      // Narrative: first pair followed by "from <tie point>"
      const fm = tieIdx < 0 && pairs.length ? /^[\s,;.]*(?:from|fr\.)\s+([^;\n]+?)(?:;|\n|,\s*thence|$)/i.exec(pairs[0].after) : null;
      if (tieIdx >= 0) { /* found above */ }
      else if (fm) { tieIdx = 0; res.tieName = fm[1].trim().replace(/[.,]$/, ''); }
      else {
        // Tabulated: a row labelled tie / TP / BLLM before the first pair
        const before = t.slice(Math.max(0, pairs[0].idx - 40), pairs[0].idx);
        if (/\b(tie|tp|t\.p\.|bllm|bbm|mbm|plss|mon)\b[^\n]*$/i.test(before)) tieIdx = 0;
        else if (opts.firstIsTie) tieIdx = 0;
      }
      const fmt = az => G.fmtBearing(az, 'plain');
      pairs.forEach((p, i) => {
        const row = { b: fmt(p.az), d: p.d.toFixed(2) };
        if (p.label) row.label = p.label;
        if (i === tieIdx) res.tieLine = row; else res.lines.push(row);
      });
      const tn = /(BLLM|BBM|MBM|PLSS|MON\.?|TIE\s*POINT)\s*(?:No\.?|#)?\s*[\w-]+(?:\s*,\s*[^;\n]{0,40})?/i.exec(t);
      if (!res.tieName && tn) res.tieName = tn[0].trim();
      return res;
    }
    // Coordinates list: name N E per line
    for (const line of t.split('\n')) {
      const nums = line.match(/-?\d[\d,]*\.\d+|-?\d{5,}/g);
      if (!nums || nums.length < 2) continue;
      const vals = nums.map(v => parseFloat(v.replace(/,/g, '')));
      const big = vals.filter(v => Math.abs(v) > 1000);
      if (big.length < 2) continue;
      const name = (/^\s*([A-Za-z]*-?\d+[A-Za-z]?|[A-Za-z]+[\w-]*)\s/.exec(line) || [])[1] || '';
      let N = big[0], E = big[1];
      if (opts.swapNE) [N, E] = [E, N];
      res.corners.push({ name: name && !nums.includes(name) ? name : String(res.corners.length + 1), N, E });
    }
    if (res.corners.length >= 3) res.kind = 'coords';
    return res;
  };

  /* ---------- OCR clean-up for photographed technical descriptions ---------- */
  /* Fixes the misreads phone OCR typically makes on titles and plans. Conservative:
   * only touches characters inside or right next to numbers and bearing words. */
  G.cleanOCR = function (text) {
    let t = String(text || '').replace(/\r/g, '');
    t = t.replace(/[‘’`´′]/g, "'").replace(/[“”″]/g, '"').replace(/ /g, ' ');
    // currency / look-alike glyphs that OCR uses for E and W in bearing columns
    t = t.replace(/[€£]/g, 'E').replace(/\bVV\b/g, 'W');
    // letters read inside numbers: 1O5 -> 105, 2l.5 -> 21.5
    for (let k = 0; k < 2; k++) {
      t = t.replace(/(\d)[Oo](?=[\d.,])/g, '$10').replace(/([\d.])[Oo](?=\d)/g, '$10');
      t = t.replace(/(\d)[lI|](?=[\d.,])/g, '$11').replace(/([\d.])[lI|](?=\d)/g, '$11');
    }
    // at the edge of a number next to bearing marks: "2l deg." "O2'" "4O°"
    t = t.replace(/(\d)[lI|](?=\s*(?:deg|°|'|"|m\b|m\.))/gi, '$11').replace(/(\d)[Oo](?=\s*(?:deg|°|'|"))/g, '$10');
    t = t.replace(/(^|[\s.(])[Oo](\d)(?=\s*(?:['"°]|deg|\.\d))/gim, '$10$2').replace(/(^|[\s.(])[lI|](\d)(?=\s*(?:['"°]|deg|\.\d))/gim, '$11$2');
    // degree-word variants: dcg. deq. deg, des. -> deg.
    t = t.replace(/\b(d[ec][gq]|des|dee)(rees?)?\s*[.,]?(?=\s*\d)/gi, 'deg. ');
    // degree glyph read as o, *, º, ˚ between two numbers: 45o 30' -> 45° 30'
    t = t.replace(/(\b\d{1,2})\s*[o*º˚°]\s*(?=\d)/g, '$1° ');
    // "S" read as "5" at the start of a bearing: "5. 30 deg." / "thence 5 30° 15' E"
    t = t.replace(/(^|[\s,;(]|thence\s)5\s*[.,]?\s+(?=\d{1,2}\s*(?:deg|°))/gim, '$1S. ');
    t = t.replace(/(^|[\s,;(])\$\s*[.,]?\s+(?=\d{1,2}\s*(?:deg|°))/gm, '$1S. ');
    // "S." misread as "&." "8." "$." "§." right after thence/being or at a line start
    t = t.replace(/(^|thence\s+|being\s+)[&8$§]\s*\.?\s*(?=\d{1,2}\s*(?:deg|°))/gim, '$1S. ');
    // doubled or lower-case quadrant letters: "Ss." "sS." "s." "Nn." before a bearing angle
    t = t.replace(/(^|[^A-Za-z])(?:[Ss]{2}|s)\s*\.?(?=\s*\d{1,2}\s*(?:deg|°))/gm, '$1S.');
    t = t.replace(/(^|[^A-Za-z])(?:[Nn]{2}|n)\s*\.?(?=\s*\d{1,2}\s*(?:deg|°))/gm, '$1N.');
    // doubled / mixed-case quadrant letters: "Ww" "WW" "vv" -> W ; "Ee" -> E
    t = t.replace(/\b(?:W[wW]|[vV]{2}|w[wW])\b/g, 'W').replace(/\bE[eE]\b/g, 'E');
    // "OO" / "oo" read for 00 before a degree or minute mark: N OO' 10' E
    t = t.replace(/(^|[\s.NS])[Oo]{2}(?=\s*(?:[°'"*’]|\d{1,2}\s*[°'"*’]))/gm, '$100').replace(/(^|[\s.NS])[Oo](\d)(?=\s*[°'"*’])/gm, '$10$2');
    // "SO" / "So" read for 50 after the degrees: S 34 SO' E
    t = t.replace(/(\d\s*[°'"*’]?\s+)[Ss5][Oo](?=\s*[°'"*’])/g, '$150');
    // "S$" -> S ; stray letter glued before E/W after the minutes: "50' FE" -> "50' E"
    t = t.replace(/\bS\$/g, 'S').replace(/(\d\s*['’°"*])\s*[FPLIT1l]([EW])\b/g, '$1 $2');
    // E/W glued to the distance: "W13.00 m." -> "W 13.00 m."
    t = t.replace(/(\d\s*['’°"*]?\s*[EWew])(?=\d)/g, '$1 ');
    // minute mark read as ) ] } before the E/W letter: "05) w" -> "05' W"
    t = t.replace(/(\d{1,2})\s*[)\]}]\s*(?=[EWew]\b)/g, "$1' ");
    // table borders and stray brackets between columns: "1-2 | N 00° 10' E | 10.00 m."
    t = t.replace(/[|¦\[\]{}]/g, ' ').replace(/[“”«»‘]/g, ' ');
    // N./S./E./W. followed by comma
    t = t.replace(/\b([NSEW]),(?=\s)/g, '$1.');
    t = t.replace(/\bVV\b/g, 'W');
    // decimal comma right before metres: 25,00 m -> 25.00 m (keeps 1,234.56)
    t = t.replace(/(\d),(\d{2})(?!\d)(\s*(?:m\b|m\.|mts?\b|meters?|metres?))/gi, '$1.$2$3');
    // split decimal: 25. 00 m -> 25.00 m
    t = t.replace(/(\d)\s*\.\s+(\d{2})(\s*(?:m\b|m\.|meters?))/gi, '$1.$2$3');
    return t;
  };

  /* Combine several OCR passes of the same document. For tables with row labels (1-2, 2-3 …)
   * each row is decided by majority vote across passes; otherwise the best-closing pass wins.
   * Returns a parse result plus canonical text that parses back to the same thing. */
  G.mergeTD = function (texts) {
    const parses = texts.map(x => G.parseTDText(G.cleanOCR(x)));
    const tidy = x => String(x || '').replace(/[—–]+/g, '-').replace(/-{2,}/g, '-').replace(/\s+/g, ' ').trim();
    const vote = arr => { const m = new Map(); arr.filter(Boolean).map(tidy).forEach((v, i) => { const e = m.get(v) || { n: 0, i, v }; e.n++; m.set(v, e); }); const w = [...m.values()].sort((a, b) => b.n - a.n || a.i - b.i)[0]; return w ? w.v : ''; };
    const nameVote = vote(parses.map(p => p.name)), tieNameVote = vote(parses.map(p => p.tieName));
    const closeOf = p => {
      if (p.kind !== 'bearings' || p.lines.length < 3) return 0;
      const c = G.computeLot({ tie: { N: 0, E: 0 }, tieLine: p.tieLine, lines: p.lines });
      return c.closure && isFinite(c.closure.precision) ? c.closure.precision : 1e9;
    };
    const labelled = parses.filter(p => p.kind === 'bearings' && p.lines.filter(l => l.label).length >= 3);

    s = String(s).trim();
    if (!s) return null;
    const neg = /^-|[SW]\s*$|^[SW]/i.test(s);
    const nums = s.match(/\d+(?:\.\d+)?/g);
    if (!nums) return null;
    const v = +nums[0] + (+nums[1] || 0) / 60 + (+nums[2] || 0) / 3600;
    return neg ? -v : v;
  };

  /* ---------- best fit (least squares) ---------- */
  /* pairs: [{x,y,X,Y}] source (x=E,y=N) -> target. model: 'similarity' | 'affine' | 'translation' */
  G.bestFit = function (pairs, model = 'similarity') {
    const n = pairs.length;
    if (n < (model === 'affine' ? 3 : model === 'similarity' ? 2 : 1)) throw new Error('Not enough control points for this model.');
    const mx = pairs.reduce((s, p) => s + p.x, 0) / n, my = pairs.reduce((s, p) => s + p.y, 0) / n;
    const mX = pairs.reduce((s, p) => s + p.X, 0) / n, mY = pairs.reduce((s, p) => s + p.Y, 0) / n;
    let fn, params;
    if (model === 'translation') {
      const tx = mX - mx, ty = mY - my;
      fn = (x, y) => ({ X: x + tx, Y: y + ty });
      params = { tx, ty, scale: 1, rot: 0 };
    } else if (model === 'similarity') {
      let sxx = 0, a1 = 0, b1 = 0;
      for (const p of pairs) {
        const x = p.x - mx, y = p.y - my, X = p.X - mX, Y = p.Y - mY;
        sxx += x * x + y * y; a1 += x * X + y * Y; b1 += x * Y - y * X;
      }
      const a = a1 / sxx, b = b1 / sxx;
      fn = (x, y) => ({ X: mX + a * (x - mx) - b * (y - my), Y: mY + b * (x - mx) + a * (y - my) });
      // rotation reported as a clockwise bearing change
      params = { a, b, scale: Math.hypot(a, b), rot: -Math.atan2(b, a) * R2D, tx: mX - (a * mx - b * my), ty: mY - (b * mx + a * my) };
    } else {
      // X = c0 + c1 x + c2 y ; Y = d0 + d1 x + d2 y  (centered)
      let Sxx = 0, Sxy = 0, Syy = 0, SxX = 0, SyX = 0, SxY = 0, SyY = 0;
      for (const p of pairs) {
        const x = p.x - mx, y = p.y - my, X = p.X - mX, Y = p.Y - mY;
        Sxx += x * x; Sxy += x * y; Syy += y * y; SxX += x * X; SyX += y * X; SxY += x * Y; SyY += y * Y;
      }
      const det = Sxx * Syy - Sxy * Sxy;
      if (Math.abs(det) < 1e-9) throw new Error('Control points are collinear.');
      const c1 = (SxX * Syy - SyX * Sxy) / det, c2 = (SyX * Sxx - SxX * Sxy) / det;
      const d1 = (SxY * Syy - SyY * Sxy) / det, d2 = (SyY * Sxx - SxY * Sxy) / det;
      fn = (x, y) => ({ X: mX + c1 * (x - mx) + c2 * (y - my), Y: mY + d1 * (x - mx) + d2 * (y - my) });
      params = { c1, c2, d1, d2, scale: Math.sqrt(Math.abs(c1 * d2 - c2 * d1)), rot: -Math.atan2(d1, c1) * R2D };
    }
    const res = pairs.map(p => { const q = fn(p.x, p.y); return { dX: p.X - q.X, dY: p.Y - q.Y, r: Math.hypot(p.X - q.X, p.Y - q.Y) }; });
    const dof = 2 * n - (model === 'affine' ? 6 : model === 'similarity' ? 4 : 2);
    const ss = res.reduce((s, r) => s + r.r * r.r, 0);
    return { fn, params, residuals: res, rms: Math.sqrt(ss / n), sigma0: dof > 0 ? Math.sqrt(ss / dof) : null, dof };
  };

  /* ---------- Delaunay (Bowyer–Watson) & contours ---------- */
  G.delaunay = function (pts) {
    const n = pts.length;
    if (n < 3) return [];
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pts) { minX = Math.min(minX, p.E); maxX = Math.max(maxX, p.E); minY = Math.min(minY, p.N); maxY = Math.max(maxY, p.N); }
    const ox = (minX + maxX) / 2, oy = (minY + maxY) / 2;
    const P = pts.map(p => [p.E - ox, p.N - oy]);
    const dm = Math.max(maxX - minX, maxY - minY) * 20 || 1;
    P.push([-dm, -dm], [dm, -dm], [0, dm]);
    let tris = [[n, n + 1, n + 2]];
    const circ = t => {
      const [a, b, c] = t.map(i => P[i]);
      const d = 2 * (a[0] * (b[1] - c[1]) + b[0] * (c[1] - a[1]) + c[0] * (a[1] - b[1]));
      const a2 = a[0] ** 2 + a[1] ** 2, b2 = b[0] ** 2 + b[1] ** 2, c2 = c[0] ** 2 + c[1] ** 2;
      const x = (a2 * (b[1] - c[1]) + b2 * (c[1] - a[1]) + c2 * (a[1] - b[1])) / d;
      const y = (a2 * (c[0] - b[0]) + b2 * (a[0] - c[0]) + c2 * (b[0] - a[0])) / d;
      return [x, y, (a[0] - x) ** 2 + (a[1] - y) ** 2];
    };
    let cc = tris.map(circ);
    // insert points in a spatially coherent order for speed
    const order = [...Array(n).keys()].sort((i, j) => P[i][0] - P[j][0]);
    for (const i of order) {
      const [px, py] = P[i];
      const bad = [], keep = [], keepC = [];
      for (let k = 0; k < tris.length; k++) {
        const c = cc[k];
        if ((px - c[0]) ** 2 + (py - c[1]) ** 2 < c[2] * (1 + 1e-12)) bad.push(tris[k]);
        else { keep.push(tris[k]); keepC.push(c); }
      }
      const edges = new Map();
      for (const t of bad) for (let e = 0; e < 3; e++) {
        const u = t[e], v = t[(e + 1) % 3], key = u < v ? u + ',' + v : v + ',' + u;
        edges.set(key, edges.has(key) ? null : [u, v]);
      }
      for (const e of edges.values()) if (e) { const t = [e[0], e[1], i]; keep.push(t); keepC.push(circ(t)); }
      tris = keep; cc = keepC;
    }
    return tris.filter(t => t[0] < n && t[1] < n && t[2] < n);
  };

  /* Contours from points [{E,N,Z}] → [{z, lines:[[{E,N}...]], index:bool}] */
  G.contours = function (pts, interval, opts = {}) {
    const tris = G.delaunay(pts).filter(t => {
      if (!opts.maxEdge) return true;
      for (let e = 0; e < 3; e++) { const a = pts[t[e]], b = pts[t[(e + 1) % 3]]; if (Math.hypot(a.E - b.E, a.N - b.N) > opts.maxEdge) return false; }
      return true;
    });
    const zs = pts.map(p => p.Z);
    const zmin = Math.min(...zs), zmax = Math.max(...zs);
    const out = [];
    const idx = opts.indexEvery || 5;
    const start = Math.ceil(zmin / interval) * interval;
    for (let z = start; z <= zmax + 1e-9; z += interval) {
      const zz = +z.toFixed(6);
      const segs = [];
      for (const t of tris) {
        const P = t.map(i => pts[i]);
        const cr = [];
        for (let e = 0; e < 3; e++) {
          const a = P[e], b = P[(e + 1) % 3];
          let za = a.Z, zb = b.Z;
          if (za === zz) za += 1e-9; if (zb === zz) zb += 1e-9;
          if ((za - zz) * (zb - zz) < 0) {
            const k = (zz - za) / (zb - za);
            cr.push({ E: a.E + k * (b.E - a.E), N: a.N + k * (b.N - a.N) });
          }
        }
        if (cr.length === 2) segs.push(cr);
      }
      out.push({ z: zz, index: Math.abs(Math.round(zz / interval) % idx) === 0, lines: chain(segs) });
    }
    return { levels: out, tris, zmin, zmax };
  };
  function chain(segs) {
    const key = p => p.E.toFixed(4) + ',' + p.N.toFixed(4);
    const map = new Map();
    segs.forEach((s, i) => s.forEach((p, j) => {
      const k = key(p); if (!map.has(k)) map.set(k, []); map.get(k).push([i, j]);
    }));
    const used = new Array(segs.length).fill(false), lines = [];
    for (let i = 0; i < segs.length; i++) {
      if (used[i]) continue;
      used[i] = true;
      const line = [segs[i][0], segs[i][1]];
      for (const dir of [1, 0]) {
        let grow = true;
        while (grow) {
          grow = false;
          const end = dir ? line[line.length - 1] : line[0];
          for (const [si, sj] of map.get(key(end)) || []) {
            if (used[si]) continue;
            used[si] = true;
            const nxt = segs[si][1 - sj];
            if (dir) line.push(nxt); else line.unshift(nxt);
            grow = true; break;
          }
        }
      }
      lines.push(line);
    }
    return lines;
  }

  /* ---------- exports ---------- */
  G.toDXF = function (layers) {
    // layers: [{name, color, polylines:[{pts:[{E,N,Z?}], closed}], texts:[{E,N,h,text,rot}], points:[{E,N,Z}]}]
    const L = [];
    const w = (c, v) => L.push(String(c), String(v));
    w(0, 'SECTION'); w(2, 'TABLES'); w(0, 'TABLE'); w(2, 'LAYER'); w(70, layers.length);
    for (const ly of layers) { w(0, 'LAYER'); w(2, ly.name); w(70, 0); w(62, ly.color || 7); w(6, 'CONTINUOUS'); }
    w(0, 'ENDTAB'); w(0, 'ENDSEC');
    w(0, 'SECTION'); w(2, 'ENTITIES');
    for (const ly of layers) {
      for (const pl of ly.polylines || []) {
        const has3d = pl.pts.some(p => p.Z != null);
        w(0, 'POLYLINE'); w(8, ly.name); w(66, 1); w(10, 0); w(20, 0); w(30, has3d ? (pl.pts[0].Z || 0) : 0); w(70, pl.closed ? 1 : 0);
        for (const p of pl.pts) { w(0, 'VERTEX'); w(8, ly.name); w(10, p.E.toFixed(4)); w(20, p.N.toFixed(4)); w(30, (p.Z || 0).toFixed(4)); }
        w(0, 'SEQEND'); w(8, ly.name);
      }
      for (const t of ly.texts || []) {
        w(0, 'TEXT'); w(8, ly.name); w(10, t.E.toFixed(4)); w(20, t.N.toFixed(4)); w(30, 0); w(40, t.h || 1); w(1, t.text); if (t.rot) w(50, t.rot.toFixed(4));
      }
      for (const p of ly.points || []) { w(0, 'POINT'); w(8, ly.name); w(10, p.E.toFixed(4)); w(20, p.N.toFixed(4)); w(30, (p.Z || 0).toFixed(4)); }
    }
    w(0, 'ENDSEC'); w(0, 'EOF');
    return L.join('\n');
  };

  G.toKML = function (name, polys) {
    // polys: [{name, ll:[{lat,lon}], color:'ff0000ff'}]
    const esc = s => String(s).replace(/[<&>]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
    let s = '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' + esc(name) + '</name>\n';
    for (const p of polys) {
      const coords = p.ll.concat([p.ll[0]]).map(q => q.lon.toFixed(8) + ',' + q.lat.toFixed(8) + ',0').join(' ');
      s += '<Placemark><name>' + esc(p.name) + '</name><Style><LineStyle><color>' + (p.color || 'ff00a5ff') + '</color><width>2</width></LineStyle><PolyStyle><color>33' + (p.color || 'ff00a5ff').slice(2) + '</color></PolyStyle></Style>' +
        '<Polygon><outerBoundaryIs><LinearRing><coordinates>' + coords + '</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>\n';
    }
    return s + '</Document></kml>';
  };

  /* Web Mercator helpers for the map */
  G.lonLatToPx = (lon, lat, z) => {
    const s = 256 * Math.pow(2, z), sinl = Math.sin(lat * D2R);
    return { x: (lon + 180) / 360 * s, y: (0.5 - Math.log((1 + sinl) / (1 - sinl)) / (4 * Math.PI)) * s };
  };
  G.pxToLonLat = (x, y, z) => {
    const s = 256 * Math.pow(2, z), lon = x / s * 360 - 180;
    const n = Math.PI - 2 * Math.PI * y / s;
    return { lon, lat: R2D * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))) };
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = G;
  else root.Geo = G;
})(typeof window !== 'undefined' ? window : globalThis);

  const ALLOWED = ['gif', 'png', 'jpg', 'jpeg', 'webp', 'txt', 'json', 'md', 'csv', 'html', 'svg', 'pdf', 'zip', 'xlsx', 'docx'];
  async function saveFile(filename, data) {
    await capsReady;
    const dl = S.caps.downloads;
    if (dl) {
      let fn = filename;
      const ext = fn.split('.').pop().toLowerCase();
      let renamed = false;
      if (!ALLOWED.includes(ext)) { fn = fn + '.txt'; renamed = true; }
      try {
        await dl.save({ filename: fn, data });
        toast(renamed ? 'Saved as ' + fn + ' — remove the .txt ending before opening in CAD/Google Earth.' : 'Saved ' + fn, renamed ? 6000 : 2600);
      } catch (e) {
        if (e && e.code === 'declined') return;

  /* ---------------- storage ---------------- */

      const [db, user, sample, downloads] = await Promise.all([use('db'), use('user'), use('sample'), use('downloads')]);

          onTiepointsChanged();

    async saveProject(p) {

        await this.db.doc('projects/' + p.id).set(rec);
      } else {
        const all = lsGet(LS_P, []).filter(x => x.id !== p.id);

    async deleteProject(id) {

    },
    async saveTie(t) {

  function onProjectsChanged() {
    // first load: reopen the last project this viewer had open
    if (S.isExample && !S.dirty && !S._reopened) {
      const last = lsGet(LS_LAST, null);
      const rec = last && S.projects.find(p => p.id === last);
      if (rec && rec.data) { S._reopened = true; openProject(clone(rec.data), false); return; }
    }
    // another staff member saved the open project — pick it up if we have no pending edits
    if (!S.isExample && !S.dirty && S.project) {
      const rec = S.projects.find(p => p.id === S.project.id);
      if (rec && rec.data && rec.updated > (S.project.updated || 0) + 500) {
        const keepLot = S.lotId; S.project = clone(rec.data);
        if (S.project.lots.some(l => l.id === keepLot)) S.lotId = keepLot; else S.lotId = S.project.lots[0]?.id;
        updateHeader(); if (S.view === 'projects' || S.view === 'home') render(); else refreshView();
        return;
      }
    }
    if (S.view === 'projects' || S.view === 'home') render();
  }
  function onTiepointsChanged() {

  const tieOptions = () => S.tiepoints.map(t => `<option value="${esc(t.name)}">${esc([t.municipality, t.province].filter(Boolean).join(', '))}</option>`).join('');

  const autosave = debounce(() => { if (!S.isExample && S.dirty) saveNow(); }, 1800);
  function markDirty() {
    S.dirty = true; updateHeader();
    if (!S.isExample) autosave();
  }
  async function saveNow(asNew) {
    if (S.saving) return;
    if (S.isExample || asNew) {
      const p = S.project;
      p.id = uid(); p.created = Date.now();
      if (S.isExample) p.name = p.name.replace(/^Example — /, '');
      S.isExample = false;
    }
    S.saving = true; updateHeader();
    try {
      await Store.saveProject(S.project);
      S.dirty = false; S.lastSaved = Date.now(); lsSet(LS_LAST, S.project.id);
    } catch (e) {
      const code = e && e.code;
      toast(code === 'quota_exceeded' ? 'Storage is full. Delete old projects, then save again.' :
        code === 'invalid_argument' ? 'You have view-only access, so changes cannot be saved. Ask the owner for Contributor access.' :
          'Could not save just now. Your changes are still on screen; press Save to try again.', 5000);
    }
    S.saving = false; updateHeader();
  }

  /* ---------------- plot view (grid coordinates, SVG) ---------------- */
  class PlotView {
    constructor(host, sceneFn) {
      this.host = host; this.sceneFn = sceneFn;
      host.classList.add('plot');
      host.innerHTML = `<svg class="draw" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="tools noprint">
          <button class="btn" data-z="fit" title="Fit to lot" aria-label="Fit to lot">${icon('fit')}</button>
          <button class="btn" data-z="in" title="Zoom in" aria-label="Zoom in">${icon('plus')}</button>
          <button class="btn" data-z="out" title="Zoom out" aria-label="Zoom out">${icon('minus')}</button>
          <button class="btn" data-z="lab" title="Show or hide line labels" aria-label="Line labels">${icon('labels')}</button>
        </div><div class="coord"></div>`;
      this.svg = $('svg', host); this.coord = $('.coord', host);
      this.s = 1; this.cx = 0; this.cy = 0; this.fitted = false;
      this.ptrs = new Map();
      host.querySelector('.tools').addEventListener('click', e => {
        const b = e.target.closest('[data-z]'); if (!b) return;
        if (b.dataset.z === 'fit') this.fit();
        if (b.dataset.z === 'in') this.zoomAt(1.5);
        if (b.dataset.z === 'out') this.zoomAt(1 / 1.5);
        if (b.dataset.z === 'lab') { S.labels = !S.labels; this.draw(); }
      });
      this.svg.addEventListener('wheel', e => { e.preventDefault(); const r = this.svg.getBoundingClientRect(); this.zoomAt(Math.pow(1.0015, -e.deltaY), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
      this.svg.addEventListener('pointerdown', e => { this.svg.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
      this.svg.addEventListener('pointermove', e => {
        const r = this.svg.getBoundingClientRect();
        const w = this.toWorld(e.clientX - r.left, e.clientY - r.top);
        this.coord.textContent = 'N ' + fx(w.N, 3) + '  E ' + fx(w.E, 3);
        if (!this.ptrs.has(e.pointerId)) return;
        const prev = this.ptrs.get(e.pointerId);
        if (this.ptrs.size === 1) {
          this.cx -= (e.clientX - prev.x) / this.s; this.cy += (e.clientY - prev.y) / this.s;
          this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); this.schedule();

          const [c, d] = [...this.ptrs.values()];
          const d1 = Math.hypot(c.x - d.x, c.y - d.y);
          if (d0 > 0) this.zoomAt(d1 / d0, (c.x + d.x) / 2 - r.left, (c.y + d.y) / 2 - r.top);
        }
      });
      const up = e => this.ptrs.delete(e.pointerId);
      this.svg.addEventListener('pointerup', up); this.svg.addEventListener('pointercancel', up);
      this.svg.addEventListener('dblclick', e => { const r = this.svg.getBoundingClientRect(); this.zoomAt(2, e.clientX - r.left, e.clientY - r.top); });

    }
    get w() { return this.host.clientWidth || 600; }
    get h() { return this.host.clientHeight || 400; }
    toScreen(p) { return [(p.E - this.cx) * this.s + this.w / 2, this.h / 2 - (p.N - this.cy) * this.s]; }
    toWorld(x, y) { return { E: this.cx + (x - this.w / 2) / this.s, N: this.cy - (y - this.h / 2) / this.s }; }
    zoomAt(f, x = this.w / 2, y = this.h / 2) {
      const before = this.toWorld(x, y);
      this.s = Math.min(Math.max(this.s * f, 1e-5), 2000);
      const after = this.toWorld(x, y);

    }
    schedule() { if (this.raf) return; this.raf = requestAnimationFrame(() => { this.raf = 0; this.draw(); }); }
    fit(all) {
      const sc = this.sceneFn() || {};
      let pts = [];
      (sc.items || []).forEach(it => { if (it.fit === false && !all) return; if (it.pts) pts.push(...it.pts); if (it.p) pts.push(it.p); });
      if (!pts.length) (sc.items || []).forEach(it => { if (it.pts) pts.push(...it.pts); if (it.p) pts.push(it.p); });
      if (!pts.length) { this.draw(); return; }
      let minE = Infinity, maxE = -Infinity, minN = Infinity, maxN = -Infinity;
      pts.forEach(p => { if (!isFinite(p.E) || !isFinite(p.N)) return; minE = Math.min(minE, p.E); maxE = Math.max(maxE, p.E); minN = Math.min(minN, p.N); maxN = Math.max(maxN, p.N); });
      if (!isFinite(minE)) { this.draw(); return; }
      const pad = 56, w = Math.max(this.w - 2 * pad, 50), h = Math.max(this.h - 2 * pad, 50);
      this.s = Math.min(w / Math.max(maxE - minE, 1), h / Math.max(maxN - minN, 1));
      this.cx = (minE + maxE) / 2; this.cy = (minN + maxN) / 2; this.fitted = true;
      this.draw();
    }
    draw() {
      const sc = this.sceneFn() || { items: [] };
      const W = this.w, H = this.h, cs = getComputedStyle(document.documentElement);
      const rc = v => (typeof v === 'string' && v.startsWith('var(')) ? cs.getPropertyValue(v.slice(4, -1)).trim() : v;
      const ink = cs.getPropertyValue('--ink').trim(), muted = cs.getPropertyValue('--muted').trim(), grid = cs.getPropertyValue('--grid').trim(), bg = cs.getPropertyValue('--plot-bg').trim();
      const out = [];
      // grid
      const target = 90 / this.s, mag = Math.pow(10, Math.floor(Math.log10(target)));
      const step = [1, 2, 5, 10].map(k => k * mag).find(v => v >= target) || target;
      const tl = this.toWorld(0, 0), br = this.toWorld(W, H);
      let g = '';
      if ((br.E - tl.E) / step < 200 && (tl.N - br.N) / step < 200) {
        for (let e = Math.ceil(tl.E / step) * step; e <= br.E; e += step) { const x = this.toScreen({ E: e, N: 0 })[0]; g += `M${x.toFixed(1)} 0V${H}`; }
        for (let n = Math.ceil(br.N / step) * step; n <= tl.N; n += step) { const y = this.toScreen({ E: 0, N: n })[1]; g += `M0 ${y.toFixed(1)}H${W}`; }
      }
      out.push(`<path d="${g}" stroke="${grid}" stroke-width="1" fill="none"/>`);
      const P = p => this.toScreen(p).map(v => v.toFixed(1)).join(' ');
      const labels = [];
      for (const it0 of sc.items || []) {
        const it = { ...it0, stroke: rc(it0.stroke), fill: rc(it0.fill), color: rc(it0.color), lc: rc(it0.lc) };
        if (it.t === 'poly' || it.t === 'line') {
          if (!it.pts || it.pts.length < 2) continue;
          const d = 'M' + it.pts.map(P).join('L') + (it.t === 'poly' ? 'Z' : '');
          out.push(`<path d="${d}" fill="${it.t === 'poly' ? (it.fill || 'none') : 'none'}" fill-opacity="${it.fo ?? 0.14}" stroke="${it.stroke || ink}" stroke-width="${it.w || 1.6}" ${it.dash ? `stroke-dasharray="${it.dash}"` : ''} stroke-linejoin="round"/>`);
        } else if (it.t === 'pt') {
          const [x, y] = this.toScreen(it.p);
          if (it.sym === 'tri') out.push(`<path d="M${x} ${y - 8}L${x + 7} ${y + 5}L${x - 7} ${y + 5}Z" fill="${it.fill || bg}" stroke="${it.stroke || ink}" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="1.6" fill="${it.stroke || ink}"/>`);
          else out.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${it.r || 3.5}" fill="${it.fill || bg}" stroke="${it.stroke || ink}" stroke-width="1.5"/>`);
          if (it.label) labels.push(`<text x="${(x + 7).toFixed(1)}" y="${(y - 7).toFixed(1)}" font-size="12" font-weight="600" fill="${it.lc || ink}" stroke="${bg}" stroke-width="3" paint-order="stroke" font-family="IBM Plex Sans, sans-serif">${esc(it.label)}</text>`);
        } else if (it.t === 'text') {
          const [x, y] = this.toScreen(it.p);
          labels.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="${it.size || 13}" font-weight="${it.weight || 600}" fill="${it.color || ink}" stroke="${bg}" stroke-width="3.5" paint-order="stroke" font-family="IBM Plex Sans, sans-serif">${esc(it.text).split('\n').map((s, i) => `<tspan x="${x.toFixed(1)}" dy="${i ? '1.2em' : '0'}">${s}</tspan>`).join('')}</text>`);
        } else if (it.t === 'seg' && S.labels) {
          const [x1, y1] = this.toScreen(it.a), [x2, y2] = this.toScreen(it.b);
          const len = Math.hypot(x2 - x1, y2 - y1);
          if (len < it.text.length * 6.2 + 10) continue;
          let ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
          if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
          // offset outward from the lot centroid
          const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
          let nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
          if (it.c) { const [cx, cy] = this.toScreen(it.c); if ((mx - cx) * nx + (my - cy) * ny < 0) { nx = -nx; ny = -ny; } }
          const ox = mx + nx * 9, oy = my + ny * 9;
          labels.push(`<text x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="${it.color || muted}" stroke="${bg}" stroke-width="3" paint-order="stroke" font-family="IBM Plex Mono, monospace" transform="rotate(${ang.toFixed(1)} ${ox.toFixed(1)} ${oy.toFixed(1)})">${esc(it.text)}</text>`);
        }
      }
      out.push(...labels);
      // north arrow & scale bar
      out.push(`<g transform="translate(22 22)"><path d="M0 -12L7 8L0 3L-7 8Z" fill="${ink}"/><text x="0" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="${ink}" font-family="Barlow Condensed, sans-serif">N</text></g>`);
      const sb = [1, 2, 5].flatMap(k => [k, k * 10, k * 100, k * 1000, k * 10000]).sort((a, b) => a - b).find(v => v * this.s >= 70) || 1;
      const sbw = sb * this.s;
      out.push(`<g transform="translate(14 ${H - 40})"><rect x="0" y="0" width="${sbw.toFixed(1)}" height="5" fill="${ink}"/><rect x="${(sbw / 2).toFixed(1)}" y="0" width="${(sbw / 2).toFixed(1)}" height="5" fill="${bg}" stroke="${ink}"/><text x="${sbw.toFixed(1)}" y="18" text-anchor="end" font-size="11" fill="${ink}" font-family="IBM Plex Mono, monospace">${sb >= 1000 ? sb / 1000 + ' km' : sb + ' m'}</text></g>`);
      this.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      this.svg.innerHTML = out.join('');
    }
    destroy() { this.ro.disconnect(); }
  }

  /* Scene builder for lots */
  function lotScene(lots, opts = {}) {
    const items = [];
    lots.forEach(L => {
      if (L.visible === false && !opts.includeHidden) return;
      const c = opts.compFor ? opts.compFor(L) : comp(L);
      if (!c.corners || c.corners.length < 2) return;
      const col = L.color, active = L.id === (opts.activeId ?? S.lotId);
      if (opts.ghost && c.unadjusted && L.adjust !== 'none' && c.closure.misclosure > 0.001) {
        const u = c.unadjusted, last = G.step(u[u.length - 1], c.closure.rows[c.closure.rows.length - 1].az, c.closure.rows[c.closure.rows.length - 1].d);
        items.push({ t: 'line', pts: [...u, last], stroke: col, w: 1, dash: '3 3' });
      }
      if (opts.showMisclosure && L.adjust === 'none' && c.unadjusted && c.closure.misclosure > 0.0005) {
        const u = c.unadjusted, r = c.closure.rows, last = G.step(u[u.length - 1], r[r.length - 1].az, r[r.length - 1].d);
        items.push({ t: 'line', pts: [u[u.length - 1], last], stroke: 'var(--bad)', w: 2 });
      }
      items.push({ t: 'poly', pts: c.corners, stroke: col, fill: col, w: active ? 2.4 : 1.5, fo: active ? 0.16 : 0.08 });
      if (opts.tie !== false && c.tie && (L.tie.N !== '' && L.tie.E !== '')) {
        items.push({ t: 'line', pts: [c.tie, c.corners[0]], stroke: col, w: 1.2, dash: '6 4', fit: false });
        items.push({ t: 'pt', p: c.tie, sym: 'tri', stroke: col, label: L.tie.name ? L.tie.name.split(',')[0] : 'Tie', fit: false });
        if (active && c.finalTie) items.push({ t: 'seg', a: c.tie, b: c.corners[0], text: G.fmtBearing(c.finalTie.az, 'dms', S.project.minutesOnly) + '  ' + c.finalTie.d.toFixed(2), color: col, fit: false });
      }
      if (active || opts.allLabels) c.corners.forEach((p, i) => {
        const q = c.corners[(i + 1) % c.corners.length], v = G.inverse(p, q);
        items.push({ t: 'seg', a: p, b: q, c: c.centroid, text: G.fmtBearing(v.az, 'dms', S.project.minutesOnly) + '  ' + v.d.toFixed(2) });
      });
      c.corners.forEach((p, i) => items.push({ t: 'pt', p, stroke: col, label: active || opts.allLabels ? String(i + 1) : '', r: active ? 3.8 : 3 }));
      if (c.centroid && c.area) items.push({ t: 'text', p: c.centroid, text: L.name + '\n' + fx(c.area, 0) + ' sq.m', color: col, size: active ? 13 : 12 });
    });
    return items;
  }

  function tieInProjectSys(t) {
    const from = t.sys || S.project.sys;
    try {
      if (G.SYSTEMS[from].kind === 'geo') return G.convert({ lat: +t.lat, lon: +t.lon }, from, S.project.sys);
      if (!isFinite(+t.N) || !isFinite(+t.E)) return null;
      return from === S.project.sys ? { N: +t.N, E: +t.E } : G.convert({ N: +t.N, E: +t.E }, from, S.project.sys);

{"lots":[{"name":"Lot 123","tie_point":"BLLM No. 1, Cad. 512-D","tie_line":{"bearing":"N 45 30 00 E","distance":123.45},"lines":[{"from":"1","to":"2","bearing":"S 30 15 00 E","distance":25.0}],"corners":[{"name":"1","northing":1623456.78,"easting":495123.45}],"area_sqm":500}]}
Rules: bearings as quadrant bearings "N dd mm ss E"; distances in metres as numbers; keep the lines in the order written, the last one returning to point 1; tie_line is the line from the tie point to corner 1 (null if none); fill corners only when the document has a coordinate table; use null for anything unreadable and never guess digits.${extra || ''}`;
    const normB = b => { const az = G.parseBearing(b); return az == null ? String(b) : G.fmtBearing(az, 'plain'); };
    const fromAI = data => {
      const lots = (data && Array.isArray(data.lots) ? data.lots : []).map(l => ({
        name: l.name || '', tieName: l.tie_point || '',
        tieLine: l.tie_line && l.tie_line.bearing && l.tie_line.distance != null ? { b: normB(l.tie_line.bearing), d: String(l.tie_line.distance) } : null,
        lines: (l.lines || []).filter(x => x && x.bearing && x.distance != null).map(x => ({ b: normB(x.bearing), d: String(x.distance) })),
        corners: (l.lines || []).length ? [] : (l.corners || []).filter(p => p && isFinite(p.northing) && isFinite(p.easting)).map(p => ({ name: p.name, N: +p.northing, E: +p.easting })),

    const aiErr = e => {

    const rotCrop = (c, dir) => !c ? null : dir > 0 ? { x: 1 - c.y - c.h, y: c.x, w: c.h, h: c.w } : { x: c.y, y: 1 - c.x - c.w, w: c.h, h: c.w };
    $('#scRotL', el).onclick = () => { sc.rot = (sc.rot + 270) % 360; sc.crop = rotCrop(sc.crop, -1); drawEditor(); };
    $('#scRotR', el).onclick = () => { sc.rot = (sc.rot + 90) % 360; sc.crop = rotCrop(sc.crop, 1); drawEditor(); };
    $('#scCropX', el).onclick = () => { sc.crop = null; drawEditor(); };

    /* ---- engine choice ---- */
    const ENG = {
      share: { label: 'Claude app · your plan', note: () => 'Sends the cropped photo to the Claude app on this phone. It uses your Claude plan, with no extra charge per scan. Copy Claude\'s answer and paste it back here.' },
      device: { label: 'On this phone · free', note: () => S.inFrame ? 'Reads the text on your device. It may not load inside claude.ai; the installed app always supports it.' : 'Reads the text on your phone. The first use downloads the reader (about 15 MB); after that it works offline. Typed documents read well; faded or handwritten ones need more checking.' },

    };

      if (!sc.engine || !avail.includes(sc.engine) || (sc.engine === 'api' && !hasApi())) sc.engine = pickDefault();
      box.innerHTML = avail.map(k => `<button class="chip" role="radio" aria-checked="${sc.engine === k}" aria-pressed="${sc.engine === k}" data-eng="${k}">${esc(ENG[k].label)}</button>`).join('');

    const apiState = () => { const s = $('#scApiState', el); if (!s) return; const c = apiCfg(); s.textContent = c.key ? `Set on this device (…${c.key.slice(-4)}) · ${API_MODELS.find(m => m[0] === c.model)?.[1] || c.model}.` : 'Optional. With your own Anthropic API key, the installed app can read photos with Claude instead of the free on-phone reader.'; };
    function apiModal() {

        <label class="f" style="margin-top:8px"><span>Model</span><select id="akModel">${API_MODELS.map(([v, l]) => `<option value="${v}" ${v === c.model ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
        <div class="btns" style="justify-content:flex-end;margin-top:14px">${c.key ? '<button class="btn danger" id="akDel">Remove key</button>' : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="akSave">Save</button></div>`,
        (m, close) => {

            if (key) sc.engine = 'api'; setEngines(); apiState(); toast(key ? 'API key saved on this device' : 'API key removed');
          };
          const d = $('#akDel', m); if (d) d.onclick = () => { lsSet('geoplot.api', { key: '', model: c.model }); close(); sc.engine = null; setEngines(); apiState(); toast('API key removed'); };
        });
    }
    const apiBtn = $('#scApiSet', el); if (apiBtn) apiBtn.onclick = apiModal;
    apiState();

    /* ---- read the photo ---- */
    let ctl = null;
    const prog = (pct, text) => { $('#scProg', el).hidden = false; $('#scBar', el).style.width = Math.round(pct * 100) + '%'; $('#scProgT', el).textContent = text; };
    const busy = on => { $('#scGo', el).disabled = on; $('#scStop', el).hidden = !on; };
    $('#scStop', el).onclick = () => { if (ctl) ctl.abort(); };
    const sharePrompt = () => aiPrompt('\n\nThe photo is attached. Put the JSON in one ```json code block and write nothing else, so it can be pasted into the GeoPlot app.');
    const copyPrompt = async () => { try { await navigator.clipboard.writeText(sharePrompt()); return true; } catch (e) { return false; } };
    async function shareToClaude() {
      const copied = await copyPrompt();
      const out = croppedCanvas(sc.img, sc.rot, sc.crop, 4000, 1800);
      const blob = await canvasBlob(out, 'image/jpeg', 0.9);

      }

        window.open('https://claude.ai/new', '_blank', 'noopener');

    };
    $('#scPasteAns', el).onclick = async () => {

      } catch (e) { /* clipboard reading not allowed: manual paste */ }

      ctl = new AbortController();
      const myCtl = ctl;
      try {
        if (sc.engine === 'device') {
          prog(0.02, 'Preparing the photo…');
          const base = croppedCanvas(sc.img, sc.rot, sc.crop, 3600, 2400);
          const STAGES = { 'loading tesseract core': ['Downloading the reader (first time only)…', 0, 0.4], 'initializing tesseract': ['Starting the reader…', 0.4, 0.5], 'loading language traineddata': ['Downloading English text model (first time only)…', 0.5, 0.9], 'initializing api': ['Starting the reader…', 0.9, 1], 'recognizing text': ['Reading', 0, 1] };
          const aborted = new Promise((_, reject) => myCtl.signal.addEventListener('abort', () => reject(Object.assign(new Error('cancelled'), { code: 'cancelled' }))));
          let best = null, bestRes = null, tried = 0, merged = null;

              const st = STAGES[m.status]; if (!st || myCtl.signal.aborted) return;

              else prog(st[1] * 0.3 + (st[2] - st[1]) * 0.3 * (m.progress || 0), st[0]);
            })]);
            tried++;
            texts.push(res.text);
            const j = judgeOCR(res.text);
            if (!best || j.score > best.score) { best = j; bestRes = res; }
            merged = G.mergeTD(texts);

            const mergedCloses = merged.kind === 'bearings' ? merged.lines.length >= 3 && merged.precision >= 2000 : merged.kind === 'coords' && merged.corners.length >= 3;

          }

            : `Read in ${tried} passes, but the result does not close. Fix the wrong digits in the Text box and tap Read text, or use Claude for this document.`);

            ? (S.inFrame ? 'The on-phone reader cannot load inside claude.ai. Choose Claude above, or use the installed app.' : 'The reader could not be downloaded. Connect to the internet once so it can be saved for offline use.')

    capsReady.then(async () => {

          ab.hidden = false;

            ab.disabled = true; ab.textContent = 'Reading…';

    if (sc.img) { drawEditor(); }

  };

  /* ----- Satellite / map ----- */
  class TileMap {
    constructor(host, overlayFn) {
      this.host = host; this.overlayFn = overlayFn;
      host.classList.add('plot');
      host.innerHTML = `<canvas></canvas><div class="tools noprint">
          <button class="btn" data-z="fit" aria-label="Fit to lots" title="Fit to lots">${icon('fit')}</button>
          <button class="btn" data-z="in" aria-label="Zoom in">${icon('plus')}</button>
          <button class="btn" data-z="out" aria-label="Zoom out">${icon('minus')}</button></div>
        <div class="legend" id="attr"></div><div class="coord"></div>`;
      this.cv = $('canvas', host); this.ctx = this.cv.getContext('2d'); this.coord = $('.coord', host);
      this.z = 17; this.c = { lat: 14.4, lon: 121 }; this.layer = 'sat';
      this.cache = new Map(); this.ok = 0; this.err = 0; this.ptrs = new Map();
      host.querySelector('.tools').addEventListener('click', e => {
        const b = e.target.closest('[data-z]'); if (!b) return;
        if (b.dataset.z === 'fit') this.fit(); if (b.dataset.z === 'in') this.zoom(1); if (b.dataset.z === 'out') this.zoom(-1);
      });
      this.cv.addEventListener('wheel', e => { e.preventDefault(); this.zoom(-e.deltaY * 0.002, e.offsetX, e.offsetY); }, { passive: false });
      this.cv.addEventListener('pointerdown', e => { this.cv.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
      this.cv.addEventListener('pointermove', e => {
        const r = this.cv.getBoundingClientRect(), ll = this.toLL(e.clientX - r.left, e.clientY - r.top);
        this.coord.textContent = G.fmtDMS(ll.lat, 1) + ' N  ' + G.fmtDMS(ll.lon, 1) + ' E';
        if (!this.ptrs.has(e.pointerId)) return;
        const p = this.ptrs.get(e.pointerId);
        if (this.ptrs.size === 1) {
          const c = G.lonLatToPx(this.c.lon, this.c.lat, this.z);
          this.c = G.pxToLonLat(c.x - (e.clientX - p.x), c.y - (e.clientY - p.y), this.z);
          this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); this.schedule();
        } else if (this.ptrs.size === 2) {
          const [a, b] = [...this.ptrs.values()], d0 = Math.hypot(a.x - b.x, a.y - b.y);
          this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
          const [c, d] = [...this.ptrs.values()], d1 = Math.hypot(c.x - d.x, c.y - d.y);
          if (d0 > 0) this.zoom(Math.log2(d1 / d0), (c.x + d.x) / 2 - r.left, (c.y + d.y) / 2 - r.top);
